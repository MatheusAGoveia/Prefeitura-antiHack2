apiVersion: 1

datasources:
  # ─── Prometheus (Métricas) ──────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    uid: govsec-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "5s"
      queryTimeout: "60s"
      httpMethod: POST
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: govsec-tempo

  # ─── Loki (Logs Estruturados JSON) ─────────────────────────────────────
  - name: Loki
    type: loki
    uid: govsec-loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: TraceID
          datasourceUid: govsec-tempo
          matcherRegex: '"trace_id":\s*"([a-f0-9]+)"'
          url: "$${__value.raw}"
          matcherType: label

  # ─── Tempo (Distributed Tracing) ───────────────────────────────────────
  - name: Tempo
    type: tempo
    uid: govsec-tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: govsec-loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: govsec-prometheus
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: govsec-prometheus
      lokiSearch:
        datasourceUid: govsec-loki
