global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: "slack-warnings"
  routes:
    - match:
        severity: critical
      receiver: "pagerduty-and-slack"
      continue: false

    - match:
        severity: warning
      receiver: "slack-warnings"
      continue: false

    - match:
        severity: info
      receiver: "dev-null"
      continue: false

inhibit_rules:
  # Quando a API estiver indisponível (ServiceDown crítico), inibir alertas secundários derivados
  - source_match:
      alertname: "ServiceDown"
      severity: "critical"
    target_match_re:
      alertname: "HighLatency|NoLogsIngested|HighErrorRate"
    equal: ["service"]

receivers:
  - name: "pagerduty-and-slack"
    webhook_configs:
      - url: "http://host.docker.internal:8000/api/v1/alerts/test-receiver"
        send_resolved: true

  - name: "slack-warnings"
    webhook_configs:
      - url: "http://host.docker.internal:8000/api/v1/alerts/test-receiver"
        send_resolved: true

  - name: "dev-null"
