[tool.poetry]
name = "govsec-shield"
version = "0.1.0"
description = "Security Operating System"
authors = ["GovSec Shield Team <dev@govsecshield.io>"]
readme = "README.md"
packages = [{include = "src", from = "."}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.100.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
pydantic = "^2.0.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
alembic = "^1.11.0"
redis = "^5.0.0"
httpx = "^0.24.0"
tenacity = "^8.2.0"
python-json-logger = "^2.0.0"
opentelemetry-api = "^1.20.0"
opentelemetry-sdk = "^1.20.0"
opentelemetry-instrumentation-fastapi = "^0.41b0"
prometheus-client = "^0.17.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
pytest-testcontainers = "^1.0.0"
testcontainers = {extras = ["postgres", "kafka"], version = "^3.0.0"}
pact-python = "^2.0.0"
black = "^23.0.0"
ruff = "^0.0.280"
mypy = "^1.4.0"
bandit = "^1.7.0"
safety = "^2.3.0"
pre-commit = "^3.3.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.3.0"
pytest-watch = "^4.2.0"
ipython = "^8.14.0"

[tool.poetry.scripts]
govsec = "src.cli.main:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src --cov-report=term-missing"
testpaths = [
    "tests/unit",
    "tests/integration",
    "tests/contract",
]
asyncio_mode = "auto"
